6" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="normal" text-anchor="start">&gt; Pelotas, Brazil</text><rect x="252" y="388" width="8" height="17" fill="#EBAAC7"><animate attributeName="opacity" values="1;1;0;0;1" dur="2.4s" repeatCount="indefinite"/></rect></svg>