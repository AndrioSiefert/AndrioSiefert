<svg xmlns="http://www.w3.org/2000/svg" width="960" height="274" viewBox="0 0 960 274" role="img" aria-labelledby="title desc"><title id="title">Architecture, data integrity and validation</title><desc id="desc">Clean, Hexagonal and multi-tenant architecture. Transactions, concurrency control, queues and idempotency. Automated unit, integration, contract and race-condition tests.</desc><defs>
      <linearGradient id="feature" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211A2B"/><stop offset="1" stop-color="#382638"/></linearGradient>
      <linearGradient id="edge"><stop stop-color="#C5A0DB" stop-opacity="0"/><stop offset=".5" stop-color="#EBAAC7"/><stop offset="1" stop-color="#EAC4A8" stop-opacity="0"/></linearGradient>
    </defs>
    <style>
      text{font-family:DejaVu Sans,Arial,sans-serif}
      .packet{stroke-dasharray:5 95;stroke-dashoffset:100;animation:transmit 8s linear infinite}
      .packet.delay{animation-delay:1s}
      .orbital{transform-box:fill-box;transform-origin:center;animation:orbit 32s linear infinite}
      .breathe{animation:breathe 8s ease-in-out infinite}
      @keyframes transmit{to{stroke-dashoffset:-100}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.packet,.orbital,.breathe{animation:none!important}.packet{stroke-dasharray:none;opacity:.3}}
    </style><rect width="960" height="274" rx="16" fill="#18151F"/><path d="M160 67H800" fill="none" stroke="#725772" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="160" cy="67" r="27" fill="#211B29" stroke="#C5A0DB"/><path d="M160 55l14 8-14 8-14-8 14-8m-14 17 14 8 14-8" fill="none" stroke="#C5A0DB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><text x="160" y="139" font-size="26" fill="#F5EAF1" font-weight="700" text-anchor="middle">Architecture</text><text x="160" y="181" font-size="18" fill="#C0AEBD" font-weight="400" text-anchor="middle">Clean · Hexagonal</text><text x="160" y="214" font-size="18" fill="#C0AEBD" font-weight="400" text-anchor="middle">Multi-tenant</text><circle cx="480" cy="67" r="27" fill="#211B29" stroke="#9BC6BD"/><path d="M467 67h26m-8-8 8 8-8 8m-8-16-8 8 8 8" fill="none" stroke="#9BC6BD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><text x="480" y="139" font-size="26" fill="#F5EAF1" font-weight="700" text-anchor="middle">Data integrity</text><text x="480" y="181" font-size="18" fill="#C0AEBD" font-weight="400" text-anchor="middle">Transactions · Concurrency</text><text x="480" y="214" font-size="18" fill="#C0AEBD" font-weight="400" text-anchor="middle">Queues · Idempotency</text><circle cx="800" cy="67" r="27" fill="#211B29" stroke="#EBAAC7"/><path d="M788 67l8 8 17-18" fill="none" stroke="#EBAAC7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="800" y="139" font-size="26" fill="#F5EAF1" font-weight="700" text-anchor="middle">Validation</text><text x="800" y="181" font-size="18" fill="#C0AEBD" font-weight="400" text-anchor="middle">Unit · Integration tests</text><text x="800" y="214" font-size="18" fill="#C0AEBD" font-weight="400" text-anchor="middle">Contracts · Race conditions</text></svg>
