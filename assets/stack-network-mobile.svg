<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="title desc"><title id="title">APIs and integrations</title><desc id="desc">REST APIs, Webhooks, SSE, JWT and OAuth 2.0. Integrations with WhatsApp API, Google Calendar and Asaas. Animated signals follow the connection paths.</desc><defs>
      <linearGradient id="feature" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211A2B"/><stop offset="1" stop-color="#382638"/></linearGradient>
      <linearGradient id="edge"><stop stop-color="#C5A0DB" stop-opacity="0"/><stop offset=".5" stop-color="#EBAAC7"/><stop offset="1" stop-color="#EAC4A8" stop-opacity="0"/></linearGradient>
    </defs>
    <style>
      text{font-family:DejaVu Sans,Arial,sans-serif}
      .packet{stroke-dasharray:5 95;stroke-dashoffset:100;animation:transmit 8s linear infinite}
      .packet.delay{animation-delay:1s}
      .orbital{transform-box:fill-box;transform-origin:center;animation:orbit 32s linear infinite}
      .breathe{animation:breathe 8s ease-in-out infinite}
      @keyframes transmit{to{stroke-dashoffset:-100}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.packet,.orbital,.breathe{animation:none!important}.packet{stroke-dasharray:none;opacity:.3}}
    </style><rect x="1" y="1" width="478" height="518" rx="16" fill="#231D24" stroke="#49394E"/><path d="M24 1h64" fill="none" stroke="#EAC4A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="28" y="49" font-size="28" fill="#F5EAF1" font-weight="700" text-anchor="start">APIs &amp; integrations</text><text x="28" y="94" font-size="22" fill="#EAC4A8" font-weight="400" text-anchor="start">REST APIs · Webhooks · SSE</text><text x="28" y="130" font-size="22" fill="#C0AEBD" font-weight="400" text-anchor="start">JWT · OAuth 2.0</text><path d="M125 330H188V242H234" fill="none" stroke="#775E70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 330H188V242H234" fill="none" stroke="#EAC4A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="packet " pathLength="100"/><path d="M125 330H188V334H234" fill="none" stroke="#775E70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 330H188V334H234" fill="none" stroke="#EAC4A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="packet delay" pathLength="100"/><path d="M125 330H188V426H234" fill="none" stroke="#775E70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 330H188V426H234" fill="none" stroke="#EAC4A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="packet " pathLength="100"/><circle cx="90" cy="330" r="37" fill="#302631" stroke="#A48191"/><path d="M77 321l-9 9 9 9m26-18 9 9-9 9m-10-22-6 26" fill="none" stroke="#EAC4A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="234" y="218" width="218" height="48" rx="8" fill="#302631" stroke="#685261"/><text x="343.0" y="249" font-size="23" fill="#F5EAF1" font-weight="400" text-anchor="middle">WhatsApp API</text><rect x="234" y="310" width="218" height="48" rx="8" fill="#302631" stroke="#685261"/><text x="343.0" y="341" font-size="23" fill="#F5EAF1" font-weight="400" text-anchor="middle">Google Calendar</text><rect x="234" y="402" width="218" height="48" rx="8" fill="#302631" stroke="#685261"/><text x="343.0" y="433" font-size="23" fill="#F5EAF1" font-weight="400" text-anchor="middle">Asaas</text><text x="240.0" y="484" font-size="19" fill="#C0AEBD" font-weight="400" text-anchor="middle">Connecting systems. Automating work.</text></svg>
